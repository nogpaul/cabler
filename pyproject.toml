[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cabler"
version = "0.1.0"
description = "Optimal cable routing from wind farms to substations."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pyogrio>=0.9",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "poethepoet>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cabler"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "PT", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running database",
]

[tool.coverage.run]
source = ["cabler"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.poe.tasks]
lint = "ruff check ."
format = "ruff format ."
format-check = "ruff format --check ."
typecheck = "mypy"
test = "pytest -m 'not integration' --cov --cov-report=term-missing"
check = ["lint", "format-check", "typecheck", "test"]
test-int = "pytest -m integration"

[[tool.mypy.overrides]]
module = ["pyogrio", "pyogrio.*", "defusedxml", "defusedxml.*"]
ignore_missing_imports = true
