[download]
# The whole layer (9,195 areas) is more than the service can build in one request (it answers 400
# above roughly 4,000 features), so the layer is fetched per area of interest with a bounding box
# in EPSG:25832: minx,miny,maxx,maxy. COUNT lifts the default page size of 500.
url = "https://geodienste.bfn.de/ogc/wfs/schutzgebiet?SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature&TYPENAMES=schutzgebiet:Landschaftsschutzgebiete&OUTPUTFORMAT=GML32%2BZIP&COUNT=100000&BBOX=270000,5560000,540000,5840000,urn:ogc:def:crs:EPSG::25832"
allowed_hosts = ["geodienste.bfn.de"]
max_bytes = 600_000_000
format = "gml.zip"
probe = "none"
