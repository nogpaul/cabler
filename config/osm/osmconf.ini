# How GDAL reads OpenStreetMap files for this project.
# Based on GDAL's own osmconf.ini; changes are marked "cabler".

# cabler: "power" added so that closed substation outlines become polygons.
closed_ways_are_polygons=aeroway,amenity,boundary,building,craft,geological,historic,landuse,leisure,military,natural,office,place,power,shop,sport,tourism,highway=platform,public_transport=platform

[points]
osm_id=yes
# cabler: keep version and timestamp: they are what makes later updates detectable.
osm_version=yes
osm_timestamp=yes
osm_uid=no
osm_user=no
osm_changeset=no
# cabler: one attribute list for every layer, matching raw.osm_object.
attributes=name,ref,operator,power,voltage,cables,circuits,generator:source,generator:method,generator:output:electricity,highway,railway,waterway,natural,landuse,building
unsignificant=created_by,converted_by,source,time,ele,attribution
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[lines]
osm_id=yes
osm_version=yes
osm_timestamp=yes
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,ref,operator,power,voltage,cables,circuits,generator:source,generator:method,generator:output:electricity,highway,railway,waterway,natural,landuse,building
ignore=created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multipolygons]
osm_id=yes
osm_version=yes
osm_timestamp=yes
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,ref,operator,power,voltage,cables,circuits,generator:source,generator:method,generator:output:electricity,highway,railway,waterway,natural,landuse,building
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[multilinestrings]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME

[other_relations]
osm_id=yes
osm_version=no
osm_timestamp=no
osm_uid=no
osm_user=no
osm_changeset=no
attributes=name,type
ignore=area,created_by,converted_by,source,time,ele,note,todo,openGeoDB:,fixme,FIXME
