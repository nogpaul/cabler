# Hooks run the tools from the project environment (no network, same versions as CI).
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: .venv/bin/python -m ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/python -m ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/python -m mypy
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest
        name: unit tests
        entry: .venv/bin/python -m pytest -q --no-cov -m "not integration"
        language: system
        pass_filenames: false
        types: [python]
